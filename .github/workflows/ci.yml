name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.11.5 • ${{ matrix.install }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        install: ["base", "all"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11.5
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"
          cache: pip

      - name: Install package (editable) + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ "${{ matrix.install }}" = "all" ]; then
            pip install -e ".[all]"
          fi

      - name: Run tests with coverage
        run: |
          pytest -q --cov=AutomationML --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-3.11.5-${{ matrix.install }}
          path: coverage.xml
